# Local dev infrastructure for Dev2Win.
# Usage: docker compose up -d   (then run client/server/ai locally)
services:
  mysql:
    image: mysql:8.4
    container_name: dev2win-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dev2win
      MYSQL_USER: dev2win
      MYSQL_PASSWORD: dev2win
    ports:
      # Host 3307 -> container 3306 (host 3306 is often taken by a local MySQL).
      - "3307:3306"
    volumes:
      - ./.docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dev2win-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dev2win-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.docker-data/qdrant:/qdrant/storage
